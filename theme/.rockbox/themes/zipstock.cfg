# ZipStock: a Rockbox theme for the Sansa Clip Zip in the style of its
# stock firmware. Load it from Settings > Theme Settings > Browse Theme Files.
wps: /.rockbox/wps/zipstock.wps
sbs: /.rockbox/wps/zipstock.sbs
fms: /.rockbox/wps/zipstock.fms
font: /.rockbox/fonts/16-Nunito-Bold.fnt
backdrop: -
iconset: -
viewers iconset: -
statusbar: top
scrollbar: off
# The theme picks each main menu page's picture from the item's icon number.
show icons: on
selector type: bar (gradient)
foreground color: E8E8E8
background color: 000000
line selector start color: 3D8EF0
line selector end color: 1C5FC4
line selector text color: FFFFFF
list separator height: off
