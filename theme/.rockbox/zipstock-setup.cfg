# ZipStock setup: a plainer Rockbox for audiobooks, laid out like the stock
# Clip Zip. Apply it from Settings > General Settings > Manage Settings >
# Browse .cfg Files, after loading the ZipStock theme. It replaces simple.cfg.
#
# Main menu pages, in order: now playing, library (the database, with
# Audiobooks first), resume (recent bookmarks), folders, radio. Settings
# always stays in the menu.
root menu order:wps,database,bookmarks,files,radio
start in screen: previous
show files: music
#
# Each book picks up where it was left, however it is opened: from the
# library, from folders, or from a bookmark. These positions live in the
# database, so it has to be built once (see the README).
autoresume enable: on
autoresume next track: custom
autoresume next track paths: /<microSD1>/audiobooks:/audiobooks
gather runtime data: on
tagcache_autoupdate: on
#
# Bookmarks too, for the resume page.
autocreate bookmarks: on
autoload bookmarks: on
autoupdate bookmarks: on
use most-recent-bookmarks: unique only
#
# Next and Previous skip chapters in books that have a cue sheet (make-cues.py).
cuesheet support: on
scroll delay: 500
scroll speed: 12
